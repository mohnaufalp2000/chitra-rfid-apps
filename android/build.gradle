group = "com.example.flutter_uhf_rfid"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.flutter_uhf_rfid"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// The UHF RFID driver SDK ships as a local .aar in android/libs/. Flutter
// plugins are subprojects of the consuming app's Gradle build, so the app's
// :app module must also be able to resolve this .aar — register the flatDir
// repository on every project in the build, not just this one.
def uhfRfidLibsDir = "$projectDir/libs"
rootProject.allprojects {
    repositories {
        flatDir {
            dirs uhfRfidLibsDir
        }
    }
}

dependencies {
    // android/libs/rfiddrive-release.aar (com.rfid.trans driver).
    implementation name: "rfiddrive-release", ext: "aar"
}
